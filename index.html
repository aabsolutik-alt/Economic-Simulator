<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Economic Simulator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <button id="reset-btn" class="reset-btn">Reset</button>
        <h1 class="header__title">Economic Simulator</h1>
        <div class="header__stats">
            <p class="header__balance">Saldo: €<span id="balance">0</span></p>
            <p class="header__income">Inkomen: €<span id="income">0</span> / sec</p>
        </div>
    </header>

    <main class="main-content">
        <section class="clicker-section">
            <button class="clicker-section__btn" id="work-btn">Werken (€ 1)</button>
        </section>

    <section class="market-section">
    <h2 class="market-section__title">Bedrijven Markt</h2>
    <div class="market-section__grid" id="business-container">
        

      <article class="business-card">
    <img src="https://cdn-icons-png.flaticon.com/512/924/924514.png" alt="Кофе" class="business-img">
    <div class="business-info">
        <h3 class="business-card__name">Koffiekraam</h3>
        <p class="business-card__price" id="koffie-price">Prijs: € 50</p>
        <p class="business-card__profit">Winst: € 2 / sec</p>
        <button class="business-card__buy-btn" id="buy-koffie">Kopen</button>
    </div>
</article>

     <article class="business-card">
  <img src="https://cdn-icons-png.flaticon.com/512/2555/2555013.png" alt="Autowasstraat" class="business-img">
    <div class="business-info">
        <h3 class="business-card__name">Autowasstraat</h3>
        <p class="business-card__price" id="auto-price">Prijs: € 250</p>
        <p class="business-card__profit">Winst: € 10 / sec</p>
        <button class="business-card__buy-btn" id="buy-auto">Kopen</button>
    </div>
</article>

     <article class="business-card">
    <img src="https://cdn-icons-png.flaticon.com/512/2933/2933936.png" alt="Автомойка" class="business-img">
    <div class="business-info">
        <h3 class="business-card__name">Autowasstraat</h3>
        <p class="business-card__price" id="bakery-price">Prijs: € 250</p>
        <p class="business-card__profit">Winst: € 10 / sec</p>
        <button class="business-card__buy-btn" id="buy-bakery">Kopen</button>
    </div>
</article>

     <article class="business-card">
    <img src="https://cdn-icons-png.flaticon.com/512/2933/2933936.png" alt="Автомойка" class="business-img">
    <div class="business-info">
        <h3 class="business-card__name">Autowasstraat</h3>
        <p class="business-card__price" id="auto-price">Prijs: € 250</p>
        <p class="business-card__profit">Winst: € 10 / sec</p>
        <button class="business-card__buy-btn" id="buy-shop">Kopen</button>
    </div>
</article>
    </div>
</section>
    </main>
    <script src="javascript.js"></script>
</body>
</html>
